<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>RiStudy Admin</title>

    <style>
        body{
            font-family:Arial;
            width:400px;
            margin:60px auto;
        }

        input,textarea{

            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{

            margin-top:20px;
            width:100%;
            padding:12px;
            font-size:18px;
        }
    </style>

</head>

<body>

<h2>RiStudy Admin</h2>

<input
id="title"
placeholder="Title">

<textarea
id="body"
rows="5"
placeholder="Body"></textarea>

<button onclick="send()">

Send Notification

</button>

<script>

async function send() {

    const title = document.getElementById("title").value;
    const body = document.getElementById("body").value;

    try {

        const response = await fetch(
            "https://ai-app-notification.onrender.com/notification/broadcast",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title,
                    body
                })
            }
        );

        console.log(response.status);

        const text = await response.text();

        console.log(text);

        if (response.ok) {
            alert("Đã gửi thành công");
        } else {
            alert("Lỗi:\n" + text);
        }

    } catch (e) {
        console.error(e);
        alert(e);
    }
}

</script>

</body>

</html>
